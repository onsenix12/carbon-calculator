name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm install --legacy-peer-deps
          npm dedupe
        
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.REACT_APP_PROXY_URL }}" ]; then
            echo "❌ ERROR: REACT_APP_PROXY_URL secret is not set!"
            echo "Please add it in GitHub Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ REACT_APP_PROXY_URL secret is set"
          echo "Proxy URL: ${{ secrets.REACT_APP_PROXY_URL }}"
      
      - name: Build project
        env:
          REACT_APP_CLAUDE_API_KEY: ${{ secrets.REACT_APP_CLAUDE_API_KEY }}
          REACT_APP_USE_PROXY: 'true'
          REACT_APP_PROXY_URL: ${{ secrets.REACT_APP_PROXY_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4